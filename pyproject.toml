[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hicona"
dynamic = ["version"]
requires-python = "<3.12" # TODO: Check full compatibility
authors = [
    { name = "Leonardo Morelli", email = "leo.morelli0@gmail.com" },
    { name = "Stefano Cretti", email = "stefanocretti99@gmail.com" },
]
description = "Network analysis toolkit for Hi-C data."
readme = "README.rst"

# TODO: add
# license = ""
# keywords = []
# classifiers = []

dependencies = [
    "cooler",
    "polars",
    "pyarrow",
    "bioframe",
    "seaborn",
    "coolbox @ git+https://github.com/StefanoCretti/CoolBox",
    "cooltools",
]

[project.optional-dependencies]
docs = ["nbsphinx", "sphinx", "sphinx_rtd_theme"]

# [project.urls]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.version]
path = "hicona/_version.py"

[tool.hatch.envs.default]
dependencies = ["pip"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
