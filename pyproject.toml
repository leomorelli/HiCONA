[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hicona"
dynamic = ["version"]
authors = [
    { name = "Leonardo Morelli", email = "leo.morelli0@gmail.com" },
    { name = "Stefano Cretti", email = "stefanocretti99@gmail.com" },
]
description = "Network analysis toolkit for Hi-C data."
readme = "README.md"

license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["hi-c", "genomics", "network analysis", "graph", "chromatin", "3D genome", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "cooler",
    "polars",
    "pyarrow",
    "bioframe",
    "seaborn",
    "coolbox==0.4.0",
    "cooltools",
]

[project.optional-dependencies]
docs = ["nbsphinx", "sphinx", "sphinx_rtd_theme"]

[project.urls]
Repository = "https://github.com/leomorelli/HiCONA"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.default]
dependencies = ["pip"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
